#!/usr/sbin/nft -f
# Oikea pääsynrajaus on palomuuri: kukin asiakas paasee vain omaan porttiinsa.
# Vaihda osoitteet omiin. Nama ovat dokumentointiin varattuja esimerkkiosoitteita.

table inet holvi {
    chain input {
        type filter hook input priority filter; policy accept;
        tcp dport 8700 ip saddr 192.0.2.10 accept
        tcp dport 8701 ip saddr 192.0.2.11 accept
        tcp dport { 8700, 8701 } drop
    }
}
