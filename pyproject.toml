[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holvi"
version = "0.1.0"
description = "Tunnusvalittaja tekoalyagenteille: agentti saa rajatun pääsyn GitHubiin ja Gmailiin (vain luku) näkemättä avaimia. MCP-palvelin."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tony Weckström" }]
requires-python = ">=3.10"
keywords = ["mcp", "ai-agents", "credentials", "secrets", "broker", "security"]
dependencies = [
  "mcp>=1.9,<3",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
holvi = "holvi.palvelin:main"
holvi-posti = "holvi.posti:main"
holvi-kirjaudu = "holvi.kirjaudu:main"

[project.urls]
Homepage = "https://github.com/tonyweckstrom1987/holvi"
Issues = "https://github.com/tonyweckstrom1987/holvi/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Use `streamable_http_client` instead:DeprecationWarning"]
